<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro Moradores</title>
</head>
<body>

<form id="form-cadastro">
  <label for="name">Nome Completo:</label><br>
  <input type="text" id="name" name="name" placeholder="Seu nome" required><br><br>

  <label for="apartment">Apartamento/Unidade:</label><br>
  <input type="text" id="apartment" name="apartment" placeholder="Ex: 101" required><br><br>

  <label for="phone">Telefone:</label><br>
  <input type="text" id="phone" name="phone" placeholder="(XX) XXXX-XXXX" required><br><br>
  
  <button type="submit">Cadastrar</button>
</form>

<script>
  const form = document.getElementById('form-cadastro');

  form.addEventListener('submit', function(event) {
    event.preventDefault();

    const name = document.getElementById('name').value;
    const apartment = document.getElementById('apartment').value;
    const phone = document.getElementById('phone').value;

    console.log('Nome:', name);
    console.log('Apartamento:', apartment);
    console.log('Telefone:', phone);
  });
</script>

</body>
</html>
